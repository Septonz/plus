name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm markets:check
      - run: pnpm functions:check-jwt
      - run: pnpm build

  contract:
    name: Soroban contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - uses: stellar/stellar-cli@v30.0.1

      - run: cargo test
      - run: stellar contract build

  functions:
    name: Edge Function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno test --no-config --node-modules-dir=none --allow-env=PIN_PEPPER,USER_REF_SECRET,AGENT_SHARED_SECRET,ALLOWED_ORIGINS --allow-read=supabase/functions supabase/functions/_shared/
      - name: Type-check every function
        run: |
          for f in agent-tools agent-api voice-session helper-api payout-sim chain-worker sync-events scheduler sender-api; do
            echo "::group::$f"
            (cd "supabase/functions/$f" && deno check index.ts)
            echo "::endgroup::"
          done
